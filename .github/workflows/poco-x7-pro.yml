name: POCO X7 Pro Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'cpmfile.json'
      - '.patch/**'
      - '.ci/android/**'
      - '.github/workflows/poco-x7-pro.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'cpmfile.json'
      - '.patch/**'
      - '.ci/android/**'
      - '.github/workflows/poco-x7-pro.yml'

permissions:
  contents: read

concurrency:
  group: poco-x7-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NUM_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle.kts
            src/android/gradle.properties
            src/android/gradle/wrapper/gradle-wrapper.properties
            src/android/app/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: >-
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          'ndk;28.2.13676358' 'cmake;3.31.6'
      - name: Build POCO X7 Pro release
        run: .ci/android/build.sh -t poco -b Release -DYUZU_DOWNLOAD_ANDROID_VVL=OFF
      - uses: actions/upload-artifact@v4
        with:
          name: eden-poco-x7-pro-${{ github.sha }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
