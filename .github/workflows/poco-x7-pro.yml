name: POCO X7 Pro Android

on:
  workflow_dispatch:
  push:
    branches: [master, codex/poco-mali-stability]
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'cpmfile.json'
      - '.patch/**'
      - '.ci/android/**'
      - '.github/workflows/poco-x7-pro.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'externals/**'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'cpmfile.json'
      - '.patch/**'
      - '.ci/android/**'
      - '.github/workflows/poco-x7-pro.yml'

permissions:
  contents: read

concurrency:
  group: poco-x7-pro-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NUM_JOBS: '2'
      CCACHE: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test audio sink logic on host
        run: python3 .ci/android/test-audio-sink.py
      - name: Test GPU wait failure accounting on host
        run: python3 .ci/android/test-nvhost-events.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle.kts
            src/android/gradle.properties
            src/android/gradle/wrapper/gradle-wrapper.properties
            src/android/app/build.gradle.kts
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install host shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends glslang-tools ccache
      - uses: actions/cache/restore@v4
        id: native-cache
        continue-on-error: true
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: poco-ndk29-${{ runner.os }}-${{ hashFiles('cpmfile.json', '.patch/**', 'CMakeModules/PocoX7Pro.cmake') }}-${{ github.sha }}
          restore-keys: |
            poco-ndk29-${{ runner.os }}-${{ hashFiles('cpmfile.json', '.patch/**', 'CMakeModules/PocoX7Pro.cmake') }}-
      - name: Install Android build tools
        run: >-
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Build POCO X7 Pro release
        run: .ci/android/build.sh -t poco -b Release -DYUZU_DOWNLOAD_ANDROID_VVL=OFF
      - name: Collect matching crash-debug artifacts
        run: python3 .ci/android/collect-debug-artifacts.py
      - name: Show native configuration diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('src/android/app/.cxx').rglob('CMakeConfigureLog.yaml'):
              print(path)
              print(path.read_text()[-24000:])
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: eden-poco-x7-pro-${{ github.sha }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: eden-poco-debug-${{ github.sha }}
          path: artifacts/debug/*
          if-no-files-found: error
          retention-days: 90


